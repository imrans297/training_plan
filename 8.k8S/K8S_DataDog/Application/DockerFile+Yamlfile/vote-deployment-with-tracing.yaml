apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      initContainers:
      - name: install-ddtrace
        image: python:3.9-slim
        command: ['sh', '-c', 'pip install ddtrace && cp -r /usr/local/lib/python3.9/site-packages/* /shared/']
        volumeMounts:
        - name: shared-libs
          mountPath: /shared
      containers:
      - name: vote
        image: your-vote-image:latest
        ports:
        - containerPort: 80
        env:
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_SERVICE
          value: "vote-app"
        - name: DD_ENV
          value: "production"
        - name: DD_VERSION
          value: "1.0.0"
        - name: DD_TRACE_AGENT_URL
          value: "http://$(DD_AGENT_HOST):8126"
        - name: PYTHONPATH
          value: "/shared:/usr/local/lib/python3.9/site-packages"
        command: ["python", "-m", "ddtrace.commands.ddtrace_run", "app.py"]
        volumeMounts:
        - name: shared-libs
          mountPath: /shared
      volumes:
      - name: shared-libs
        emptyDir: {}